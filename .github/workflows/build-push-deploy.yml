name: Build, Push, and Deploy Backend

# Branch == environment. A push to `dev` deploys to the shared dev environment;
# a push to `staging` deploys to the shared staging environment. The branch ->
# environment -> deploy-role -> release-Lambda mapping is owned by
# sbp-infrastructure; this workflow only derives the environment name from the
# branch. The OIDC trust policy on each per-env role (see
# sbp-infrastructure/lib/backend-service-stack.ts) enforces that only the
# matching branch can assume it.
on:
  push:
    branches:
      - dev
      - staging

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-southeast-2
  AWS_ACCOUNT_ID: '456789093900'
  ECR_REPOSITORY: sbp-backend

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve environment from branch
        id: env
        run: |
          set -euo pipefail
          ENV="${GITHUB_REF_NAME}"            # dev | staging
          ENV_TITLE="$(tr '[:lower:]' '[:upper:]' <<< "${ENV:0:1}")${ENV:1}"
          echo "name=${ENV}" >> "$GITHUB_OUTPUT"
          echo "role=sbp-backend-${ENV}-github-actions-deploy-role" >> "$GITHUB_OUTPUT"
          echo "lambda=SbpBackend${ENV_TITLE}ReleaseDeployer" >> "$GITHUB_OUTPUT"
          echo "tag=${ENV}" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/${{ steps.env.outputs.role }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ steps.env.outputs.tag }}
        run: |
          set -euo pipefail
          docker build -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" .
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          echo "image_uri=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> "$GITHUB_OUTPUT"

      - name: Deploy to ECS via Lambda
        env:
          DEPLOY_LAMBDA_NAME: ${{ steps.env.outputs.lambda }}
          IMAGE_TAG: ${{ steps.env.outputs.tag }}
        run: |
          set -euo pipefail
          aws lambda invoke \
            --function-name "$DEPLOY_LAMBDA_NAME" \
            --invocation-type Event \
            --cli-binary-format raw-in-base64-out \
            --payload "{\"tag\":\"$IMAGE_TAG\"}" \
            /tmp/response.json
          cat /tmp/response.json
